name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
assignees:
  - ericmarkewitz
type: bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      placeholder: Tell us what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs or error messages. This will be formatted as code automatically.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How soon should this be picked up? Android-only work is low priority while we focus on iPhone. A maintainer applies the matching `priority:` label.
      options:
        - High
        - Medium
        - Low
      default: 1
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots or screen recordings to help explain the problem.
    validations:
      required: false
