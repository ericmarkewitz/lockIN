name: Feature Request or Proposal
description: Suggest a new feature or propose an improvement to the project.
title: "[FEAT] "
labels: ["enhancement"]
assignees:
  - ericmarkewitz
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search existing issues to make sure this hasn't already been proposed.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or limitation you're running into.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen. Include how it should look or behave if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: dropdown
    id: platforms
    attributes:
      label: Platform(s)
      description: Which platform(s) does this apply to?
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How soon should this be picked up? Android-only work is low priority while we focus on iPhone. A maintainer applies the matching `priority:` label.
      options:
        - High
        - Medium
        - Low
      default: 1
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, links, or references about the feature request.
    validations:
      required: false
  - type: upload
    id: mockups
    attributes:
      label: Upload mockups or screenshots
      description: If applicable, add mockups, sketches, or screenshots to illustrate the idea.
    validations:
      required: false
