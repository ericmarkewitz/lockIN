name: CI Workflow
description: Run basic CI checks on the codebase.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v7
        
        - name: Set up Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '26'
        
        - name: Install dependencies
          run: npm ci

        - name: Typecheck
          run: npx tsc --noEmit

        - name: Lint
          run: npx expo lint

        - name: Test
          run: npm test -- --ci
